[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-ciciot2023-app"
version = "2.0.0"
description = "Classical ML vs deep learning for IoT intrusion detection on CICIoT2023: results app and flow classifier"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scikit-learn==1.9.1", "joblib==1.6.0", "torch>=2.2", "keras>=3.3", "altair>=5.0",
  "streamlit>=1.50",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
