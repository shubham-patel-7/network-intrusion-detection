[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idsbench"
version = "1.0.0"
description = "Controlled benchmark of classical ML and deep learning intrusion detectors on CICIoT2023"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "imbalanced-learn>=0.12", "statsmodels>=0.14",
  "matplotlib>=3.8", "joblib>=1.3", "keras>=3.3",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
tensorflow = ["tensorflow>=2.16"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the CICIoT2023 CSV files (registration form, see README)"]
